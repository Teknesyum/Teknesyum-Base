name: Catalog index

on:
  schedule:
    - cron: '7 * * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency: catalog-index

jobs:
  index:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build index
        working-directory: src-tauri
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo run --bin katalog -- Teknesyum ../index.json
      - name: Publish
        shell: bash
        run: |
          mkdir out
          cp index.json out/
          cd out
          git init -q -b katalog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -q -m "Catalog index"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" katalog
