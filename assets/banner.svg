<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Teknesyum Base — relay architecture for contracts, agents, hooks, and audit">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="55%" stop-color="#b026ff"/>
      <stop offset="100%" stop-color="#ff00ea"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff00ea" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="#000000"/>
  <rect x="1" y="1" width="1198" height="318" rx="28" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.55"/>

  <g transform="translate(72 72)">
    <g filter="url(#glow)" fill="none" stroke="url(#neon)" stroke-width="6" stroke-linecap="round">
      <path d="M128 96 C128 140 84 142 72 166"/>
      <path d="M128 96 L128 168"/>
      <path d="M128 96 C128 140 172 142 184 166"/>
    </g>
    <g filter="url(#glow)">
      <circle cx="128" cy="78" r="22" fill="#000000" stroke="#00f3ff" stroke-width="8"/>
      <circle cx="72" cy="182" r="15" fill="#000000" stroke="#b026ff" stroke-width="8"/>
      <circle cx="128" cy="184" r="15" fill="#000000" stroke="#ff00ea" stroke-width="8"/>
      <circle cx="184" cy="182" r="15" fill="#000000" stroke="#34d399" stroke-width="8"/>
    </g>
  </g>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <text x="320" y="132" font-size="62" font-weight="700" fill="#ffffff" letter-spacing="1">Teknesyum Base</text>
    <text x="322" y="180" font-size="24" fill="#00f3ff" letter-spacing="2">RELAY ARCHITECTURE FOR CLAUDE CODE</text>
    <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="20" fill="#ffffff">
      <text x="322" y="232">Request</text>
      <text x="432" y="232" fill="#b026ff">→</text>
      <text x="464" y="232">Contracts</text>
      <text x="604" y="232" fill="#b026ff">→</text>
      <text x="636" y="232">Agents</text>
      <text x="752" y="232" fill="#b026ff">→</text>
      <text x="784" y="232">Audit</text>
      <text x="884" y="232" fill="#b026ff">→</text>
      <text x="916" y="232" fill="#34d399">Done</text>
    </g>
  </g>
  <rect x="32" y="304" width="1136" height="4" rx="2" fill="url(#edge)"/>
</svg>
