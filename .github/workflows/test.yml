name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test/all.js
      - name: tests leave the tree clean
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the test run left files behind:"
            git status --porcelain
            exit 1
          fi
      - run: node teknesyum/scripts/platform-denetim.js . --kati

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes @biomejs/biome@2 ci --diagnostic-level=error
