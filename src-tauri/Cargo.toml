[package]
name = "teknesyum-base"
version = "3.0.0"
description = "Browse and install the programs of a GitHub account"
authors = ["Teknesyum"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "teknesyum_base_lib"
crate-type = ["staticlib", "rlib"]

[features]
default = []
pro = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
tokio = { version = "1", features = ["time", "sync", "rt"] }
futures-util = "0.3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["windows-native"] }
mslnk = "0.1"
dirs = "6"
glob = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
